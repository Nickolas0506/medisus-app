server.port=${PORT:8080}
spring.application.name=medisus-distribuicao

# local: H2 em arquivo; producao: SPRING_DATASOURCE_URL/USERNAME/PASSWORD do PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/distribuicao;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# distribuicao do APK para testadores (substitui o Firebase App Distribution)
medisus.distribuicao.admin-token=${MEDISUS_ADMIN_TOKEN:}
# opcional: endereco publico usado nos links de convite (sem isso, usa o host da requisicao)
medisus.distribuicao.url-publica=${MEDISUS_URL_PUBLICA:}
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=160MB
# atras de proxy (Railway/Azure): links de convite saem com https
server.forward-headers-strategy=framework
